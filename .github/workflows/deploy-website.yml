# Builds the PC website (website/, a Flutter web project) and pushes it to
# the gh-pages branch of vspo-m/vspo-m.github.io: https://vspo-m.github.io
#
# Only runs for pushes to main that change website/ (or this file), so
# website changes never trigger build-apk.yml and app changes never trigger
# this.
# One-time setup: a deploy key with write access on vspo-m/vspo-m.github.io,
# its private half saved here as the Actions secret PAGES_DEPLOY_KEY; that
# repo's Settings -> Pages -> Deploy from a branch -> gh-pages / (root).
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Keeps the offline-fallback copies of both song lists fresh. Reads
      # catalog-scraper/ only; nothing outside website/ is changed.
      - name: Bundle the current catalog as the offline fallback
        run: |
          cp ../catalog-scraper/catalog.json assets/catalog.json
          cp ../catalog-scraper/himehina.json assets/himehina.json

      - name: Install dependencies
        run: flutter pub get

      - name: Check volume leveling logic
        run: flutter test

      # vspo-m.github.io serves the site at the domain root.
      - name: Build
        run: flutter build web --release --base-href /

      # force_orphan: gh-pages keeps only the latest build, so the repo
      # doesn't grow by a full site copy on every deploy.
      - name: Publish to vspo-m.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: vspo-m/vspo-m.github.io
          publish_branch: gh-pages
          publish_dir: website/build/web
          force_orphan: true
