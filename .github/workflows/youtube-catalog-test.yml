# Report-only test of the YouTube-based catalog builder (catalog-scraper/youtube.js).
# Manual only. Commits nothing: download the "youtube-catalog-report" artifact
# from the run page to see report.md, catalog.candidate.json and members.json.
name: YouTube catalog test (report only)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Uploads pages (50 videos each) to read per channel. Empty = all (first full scan).'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check helper logic
        run: node youtube.test.js

      - name: Build candidate catalog + report
        run: node youtube.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
          MAX_PAGES: ${{ inputs.max_pages }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-catalog-report
          path: |
            catalog-scraper/report.md
            catalog-scraper/catalog.candidate.json
            catalog-scraper/members.json
          if-no-files-found: ignore
